<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="module" src="/src/main.ts"></script>
</head>

<body>
    <div style="background:black; width:300px;">
        <button class="btn btn--primary">
            <img class="btn__icon btn__icon--rotate" src="/assets/icons/controller.svg" alt="">
            <span class="btn__text">Play</span>
            <img class="btn__icon btn__icon--scale" src="/assets/icons/Arrow.svg" alt="">
        </button>
        <button class="btn btn--secondary">
            <img class="btn__icon btn__icon--scale" src="public/assets/icons/exit.svg" alt="Icon Exit">
            <span class="btn__text">Exit game</span>
        </button>
        <button class="btn btn--teritiary">
            <img class="btn__icon btn__icon--rotate-scale" src="public/assets/icons/play.svg" alt="Icon Play">
            <span class="btn__text">Start</span>
        </button>
        <button class="btn btn--teritiary" disabled>
            <img class="btn__icon btn__icon--rotate-scale" src="public/assets/icons/play.svg" alt="Icon Play">
            <span class="btn__text">Start</span>
        </button>
    </div>
    <fieldset class="theme-selection">
        <legend>Select a theme:</legend>

        <div class="theme-box">
            <input type="radio" id="coding-theme" name="theme" value="coding">
            <label for="coding-theme">Coding theme</label>
            <span class="theme-arrow"></span>
        </div>

        <div class="theme-box">
            <input type="radio" id="gaming-theme" name="theme" value="gaming">
            <label for="gaming-theme">Gaming theme</label>
            <span class="theme-arrow"></span>
        </div>
    </fieldset>
    <section class="setting-bar">
        <ul>
            <li id="csettingTheme">Game theme</li>
            <li class="checked" id="csettingPlayer">Player</li>
            <li id="csettingBoardSize">Board size</li>
        </ul>
        <button class="btn btn--teritiary">
            <img class="btn__icon btn__icon--rotate-scale" src="public/assets/icons/play.svg" alt="Icon Play">
            <span class="btn__text">Start</span>
        </button>
    </section>
    <div class="" data-theme="coding">
        <section id="field">
            <button class="card">
                <div class="card__inner">
                    <div class="card__face"><img src="public/assets/icons/develope.svg" alt=""></div>
                    <div class="card__face card__face--back"><img src="public/assets/img/logo-typescript.png"
                            alt="Logo Typescript"></div>
                </div>
            </button>
            <button class="card">
                <div class="card__inner">
                    <div class="card__face"><img src="public/assets/icons/develope.svg" alt=""></div>
                    <div class="card__face card__face--back card__face--back-match"><img
                            src="public/assets/img/logo-typescript.png" alt="Logo Typescript"></div>
                </div>
            </button>
        </section>
        <button class="btn btn--secondary">
            <img class="btn-icon" src="public/assets/icons/exit.svg" alt="Icon Exit">
            <span>Exit game</span>
        </button>
    </div>
    <div class="" data-theme="gaming">

        <section id="field--gaming">
            <button class="card">
                <div class="card__inner">
                    <div class="card__face"></div>
                    <div class="card__face card__face--back"><img src="public/assets/img/pilz.png" alt="Pilz"></div>
                </div>
            </button>
            <button class="card">
                <div class="card__inner">
                    <div class="card__face"><img src="public/assets/icons/develope.svg" alt=""></div>
                    <div class="card__face card__face--back card__face--back-match"><img
                            src="public/assets/img/logo-typescript.png" alt="Logo Typescript"></div>
                </div>
            </button>
        </section>
        <button class="btn btn--secondary">
            <img class="btn-icon" src="public/assets/icons/exit.svg" alt="Icon Exit">
            <span>Exit game</span>
        </button>
    </div>
</body>

</html>
