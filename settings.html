<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory</title>
</head>

<body>
    <script type="module" src="/src/settings.ts"></script>
    <!-- <link rel="stylesheet" src="src/styles/scss/main.scss"> -->

    <section class="settings">
        <div class="content">
            <h2 class="settings__title">Settings</h2>
            <div class="setting-cols">
                <div class="settings__choosebox settings__choosebox--themes">
                    <fieldset class="theme-selection">
                        <legend>Game themes</legend>

                        <div class="theme-box">
                            <input type="radio" id="codingTheme" name="theme" value="coding">
                            <label for="codingTheme">Coding theme</label>
                        </div>

                        <div class="theme-box">
                            <input type="radio" id="gamingTheme" name="theme" value="gaming">
                            <label for="gamingTheme">Gaming theme</label>
                        </div>
                    </fieldset>

                    <fieldset class="theme-selection">
                        <legend>Choose Player</legend>

                        <div class="theme-box">
                            <input type="radio" id="playerBlue" name="player" value="Blue">
                            <label for="playerBlue">Blue</label>
                        </div>

                        <div class="theme-box">
                            <input type="radio" id="playerOrange" name="player" value="Orange">
                            <label for="playerOrange">Orange</label>
                        </div>
                    </fieldset>

                    <fieldset class="theme-selection">
                        <legend>Board size</legend>

                        <div class="theme-box">
                            <input type="radio" id="boardSize16" name="boardSize" value="16">
                            <label for="boardSize16">16 Cards</label>
                        </div>

                        <div class="theme-box">
                            <input type="radio" id="boardSize24" name="boardSize" value="24">
                            <label for="boardSize24">24 Cards</label>
                        </div>

                        <div class="theme-box">
                            <input type="radio" id="boardSize36" name="boardSize" value="36">
                            <label for="boardSize36">36 Cards</label>
                        </div>
                    </fieldset>
                </div>
                <section class="settings__previewbox">
                    <img src="public/assets/img/pre-coding.png" alt="" id="preCoding">
                    <section class="setting-bar">
                        <ul>
                            <li id="csettingTheme">Game theme</li>
                            <li  id="csettingPlayer">Player</li>
                            <li id="csettingBoardSize">Board size</li>
                        </ul>
                        <button class="btn btn--teritiary" id="startGame">
                            <img class="btn__icon" src="public/assets/icons/play.svg" alt="">
                            <span class="btn__text">Start</span>
                        </button>
                    </section>
                </section>
            </div>
        </div>
    </section>



</body>

</html>
